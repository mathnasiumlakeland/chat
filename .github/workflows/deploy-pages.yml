name: Deploy GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Configure GitHub Pages
        id: pages
        uses: actions/configure-pages@v5

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Verify checked-in runtime assets
        run: |
          test -f static/runtime/prism/single-thread/wllama.js
          test -f static/runtime/prism/single-thread/wllama.wasm
          test -f static/runtime/prism/single-thread/runtime-manifest.json

      - name: Typecheck
        run: bun run check

      - name: Run unit tests
        run: bun run test

      - name: Build production site
        env:
          BASE_PATH: ${{ steps.pages.outputs.base_path }}
        run: bun run build

      - name: Finalize GitHub Pages artifact
        run: |
          if [ ! -f build/index.html ]; then
            cp build/404.html build/index.html
          fi
          touch build/.nojekyll

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: build
          include-hidden-files: true

  deploy:
    runs-on: ubuntu-latest
    needs: build
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
